version: "3.8"

services:
  # 1. OceanShield Express REST API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oceanshield-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/oceanshield
      - JWT_SECRET=prod_oceanshield_super_secure_jwt_secret_key_2026
      - JWT_EXPIRES_IN=1h
      - JWT_REFRESH_SECRET=prod_oceanshield_refresh_secret_key_2026
      - JWT_REFRESH_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:5173
      - AI_SERVICE_URL=http://ai-service:8000
      - REDIS_URL=redis://redis:6379
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=100
      - AUTH_RATE_LIMIT_MAX=10
      - REPORT_RATE_LIMIT_MAX=15
      - INCIDENT_CLUSTER_RADIUS_METERS=5000
      - INCIDENT_CLUSTER_TIME_MINUTES=1440
      - UPLOAD_MAX_SIZE_MB=25
    volumes:
      - backend-uploads:/usr/src/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - oceanshield-net

  # 2. Python AI Inference Microservice
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: oceanshield-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - oceanshield-net

  # 3. MongoDB with Geospatial Indexing Support
  mongo:
    image: mongo:7.0
    container_name: oceanshield-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oceanshield-net

  # 4. Redis for Caching and Background Queueing
  redis:
    image: redis:7-alpine
    container_name: oceanshield-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - oceanshield-net

volumes:
  mongo-data:
  backend-uploads:
  redis-data:

networks:
  oceanshield-net:
    driver: bridge
